<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Facebook Login with Django + JWT</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f0f2f5;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    button {
      background-color: #1877f2;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #145dbf;
    }

    pre {
      text-align: left;
      background: #f7f7f7;
      padding: 15px;
      border-radius: 5px;
      max-width: 500px;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🔐 Facebook Login with Django + JWT</h2>
    <button onclick="facebookLogin()">Login with Facebook</button>
    <div id="result"></div>
  </div>

  <!-- Facebook SDK -->
  <script async defer crossorigin="anonymous" 
    src="https://connect.facebook.net/en_US/sdk.js"></script>

  <script>
    // Initialize Facebook SDK
    window.fbAsyncInit = function() {
      FB.init({
        appId      : '2647325695607782', 
        cookie     : true,
        xfbml      : true,
        version    : 'v20.0'
      });
    };

    function facebookLogin() {
      FB.login(function(response) {
        if (response.authResponse) {
          const accessToken = response.authResponse.accessToken;
          console.log("Facebook Access Token:", accessToken);

          // Send token to Django backend
          fetch("http://127.0.0.1:8000/auth/facebook/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ access_token: accessToken })
          })
          .then(res => res.json())
          .then(data => {
            document.getElementById("result").innerHTML = `
              <h3>✅ Login Successful</h3>
              <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
          })
          .catch(err => {
            document.getElementById("result").innerHTML = `
              <h3>❌ Error</h3>
              <pre>${err}</pre>
            `;
          });
        } else {
          alert("Facebook login cancelled or failed.");
        }
      }, { scope: 'public_profile,email' }); // 👈 Request email permission
    }
  </script>

</body>
</html>
